[project]
  name = "baubap_mlflow"
  description = "The MLflow provider for Pulumi manages MLflow experiments, model registry entries, and access-control resources through the MLflow REST API. It supports MLflow tracking servers 2.x and 3.x."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["mlflow", "mlops", "machine-learning", "model-registry", "category/infrastructure", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.2.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://github.com/Baubap/pulumi-mlflow"
    Repository = "https://github.com/Baubap/pulumi-mlflow"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      baubap_mlflow = ["py.typed", "pulumi-plugin.json"]
