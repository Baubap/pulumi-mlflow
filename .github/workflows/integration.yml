name: integration

# End-to-end tests against REAL MLflow servers. A single `e2e` job brings up the
# full stack (two MLflow servers + a shared MinIO) per MLflow version and runs
# the whole suite: per-resource lifecycle tests plus cross-server model
# promotion. Versions are parametrizable via the `versions`/`full` inputs.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated MLflow image tags (overrides the default set)"
        default: ""
      full:
        description: "Run the full sweep across every supported minor version"
        type: boolean
        default: false
  pull_request:
    paths:
      - "provider/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
  schedule:
    # Weekly full minor-version sweep (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Resolve the parametrizable inputs into a version matrix.
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        env:
          # Fast, blocking set for PRs/pushes: supported floor + latest of each major.
          PR_SET: "v2.9.2,v2.22.4,v3.15.1"
          # Full sweep (weekly cron / manual `full`): latest patch of every supported
          # minor. Floor is 2.9 (aliases mature; stages deprecated). Older versions can
          # still be tested ad-hoc via the `versions` input.
          FULL_SET: "v2.9.2,v2.10.2,v2.11.3,v2.12.2,v2.13.2,v2.14.3,v2.15.1,v2.16.2,v2.17.2,v2.18.0,v2.19.0,v2.20.3,v2.21.3,v2.22.4,v3.0.1,v3.1.4,v3.2.0,v3.3.2,v3.4.0,v3.5.1,v3.6.0,v3.7.0,v3.8.1,v3.9.0,v3.10.1,v3.11.1,v3.12.0,v3.13.0,v3.14.0,v3.15.1"
        run: |
          IN="${{ github.event.inputs.versions }}"
          if [ -n "$IN" ]; then
            VERSIONS="$IN"                                   # explicit override
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.full }}" = "true" ]; then
            VERSIONS="$FULL_SET"                             # weekly / manual full sweep
          else
            VERSIONS="$PR_SET"                              # PR / push default
          fi
          echo "Selected MLflow versions: $VERSIONS"
          echo "versions=$(echo "$VERSIONS" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')" >> "$GITHUB_OUTPUT"

  # Single e2e job: one stack (two MLflow servers + MinIO) per MLflow version,
  # running the WHOLE suite — per-resource lifecycle AND cross-server promotion.
  e2e:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mlflow: ${{ fromJSON(needs.config.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Bring up MLflow (source + dest) + MinIO
        run: make e2e-up MLFLOW_TAG=${{ matrix.mlflow }}
      - name: Run e2e suite
        run: make test_e2e
      - name: Compose logs
        if: always()
        run: docker compose -f provider/e2e/docker-compose.e2e.yml logs || true
      - name: Tear down
        if: always()
        run: make e2e-down || true
