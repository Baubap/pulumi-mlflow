name: integration

# End-to-end tests against REAL MLflow tracking servers. Parametrizable over
# versions and servers:
#   - workflow_dispatch inputs `versions` / `uris` (see below)
#   - repo variable `MLFLOW_E2E_URIS` to always also test external servers
# Ephemeral servers are spun up per version; external servers are tested via the
# provider suite's multi-server mode (MLFLOW_TRACKING_URIS).
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated MLflow image tags (overrides the default set)"
        default: ""
      full:
        description: "Run the full sweep across every supported minor version"
        type: boolean
        default: false
      uris:
        description: "Comma-separated external tracking server URIs to test (in addition to ephemeral)"
        default: ""
  pull_request:
    paths:
      - "provider/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
  schedule:
    # Weekly full minor-version sweep (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Resolve the parametrizable inputs into a version matrix + an external-URI list.
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
      uris: ${{ steps.set.outputs.uris }}
    steps:
      - id: set
        env:
          # Fast, blocking set for PRs/pushes: supported floor + latest of each major.
          PR_SET: "v2.9.2,v2.22.4,v3.15.1"
          # Full sweep (weekly cron / manual `full`): latest patch of every supported
          # minor. Floor is 2.9 (aliases mature; stages deprecated). Older versions can
          # still be tested ad-hoc via the `versions` input.
          FULL_SET: "v2.9.2,v2.10.2,v2.11.3,v2.12.2,v2.13.2,v2.14.3,v2.15.1,v2.16.2,v2.17.2,v2.18.0,v2.19.0,v2.20.3,v2.21.3,v2.22.4,v3.0.1,v3.1.4,v3.2.0,v3.3.2,v3.4.0,v3.5.1,v3.6.0,v3.7.0,v3.8.1,v3.9.0,v3.10.1,v3.11.1,v3.12.0,v3.13.0,v3.14.0,v3.15.1"
        run: |
          IN="${{ github.event.inputs.versions }}"
          if [ -n "$IN" ]; then
            VERSIONS="$IN"                                   # explicit override
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.full }}" = "true" ]; then
            VERSIONS="$FULL_SET"                             # weekly / manual full sweep
          else
            VERSIONS="$PR_SET"                              # PR / push default
          fi
          echo "Selected MLflow versions: $VERSIONS"
          echo "versions=$(echo "$VERSIONS" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')" >> "$GITHUB_OUTPUT"
          # External URIs: dispatch input takes precedence, else repo variable.
          URIS="${{ github.event.inputs.uris }}"
          [ -z "$URIS" ] && URIS="${{ vars.MLFLOW_E2E_URIS }}"
          echo "uris=$URIS" >> "$GITHUB_OUTPUT"

  # One ephemeral MLflow server per version tag; run the full lifecycle suite.
  ephemeral:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mlflow: ${{ fromJSON(needs.config.outputs.versions) }}
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      # GitHub `services:` can't override a container's command, and the MLflow
      # image entrypoint doesn't start `mlflow server` with the flags we need,
      # so run it explicitly and health-poll before testing.
      - name: Start MLflow ${{ matrix.mlflow }}
        run: |
          docker run -d --name mlflow -p 5000:5000 \
            ghcr.io/mlflow/mlflow:${{ matrix.mlflow }} \
            mlflow server --host 0.0.0.0 --port 5000 \
            --backend-store-uri sqlite:////tmp/mlflow.db \
            --artifacts-destination /tmp/artifacts
          echo "waiting for MLflow to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf "$MLFLOW_TRACKING_URI/health" >/dev/null 2>&1; then
              echo "MLflow up:"; curl -s "$MLFLOW_TRACKING_URI/version"; echo; exit 0
            fi
            sleep 2
          done
          echo "MLflow did not become healthy"; docker logs mlflow; exit 1

      - name: Run e2e suite
        run: go test -v -count=1 -tags=e2e -timeout 20m ./provider/e2e/...

      - name: MLflow logs
        if: always()
        run: docker logs mlflow || true
      - name: Stop MLflow
        if: always()
        run: docker rm -f mlflow || true

  # Run the same suite against externally-provided tracking servers (multi-server
  # mode). Only runs when URIs were provided via input or the repo variable.
  external:
    needs: config
    if: ${{ needs.config.outputs.uris != '' }}
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URIS: ${{ needs.config.outputs.uris }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run e2e suite against external servers
        # Auth for external servers, if any, comes from repo secrets.
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
        run: go test -v -count=1 -tags=e2e -timeout 20m ./provider/e2e/...
