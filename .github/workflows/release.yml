name: release
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-**"

env:
  GOVERSION: "1.26.x"
  NODEVERSION: "20.x"
  PYTHONVERSION: "3.11"
  PROVIDER: mlflow

jobs:
  prerequisites:
    name: build provider + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: version
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - uses: pulumi/actions@v6
      - uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: pulumi/pulumictl
      - name: Build provider + schema
        run: make provider generate_schema
      - name: Package provider binary
        run: tar -zcf pulumi-${{ env.PROVIDER }}-provider.tar.gz -C bin pulumi-resource-${{ env.PROVIDER }}
      - uses: actions/upload-artifact@v4
        with:
          name: pulumi-${{ env.PROVIDER }}-provider.tar.gz
          path: pulumi-${{ env.PROVIDER }}-provider.tar.gz

  build_sdks:
    name: build ${{ matrix.language }} SDK
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, go]
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - uses: pulumi/actions@v6
      - uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: pulumi/pulumictl
      - name: Generate ${{ matrix.language }} SDK
        run: make generate_${{ matrix.language }}
      - name: Package SDK
        run: tar -zcf ${{ matrix.language }}-sdk.tar.gz -C sdk/${{ matrix.language }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ matrix.language }}-sdk.tar.gz

  publish_plugin:
    name: publish plugin binaries (GitHub Release)
    needs: build_sdks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_sdks:
    name: publish npm SDK
    needs: publish_plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PyPI is published separately via OIDC trusted publishing (see publish_python).
      # Add ,dotnet / java here once their registry namespaces (NuGet / Sonatype) exist.
      - name: Publish npm SDK
        uses: pulumi/pulumi-package-publisher@v0.0.22
        with:
          sdk: nodejs
          version: ${{ env.PROVIDER_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_python:
    name: publish PyPI SDK (trusted publishing)
    needs: publish_plugin
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing — no API token needed
      contents: read
    environment: pypi # must match the environment on PyPI's trusted publisher
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the generated Python SDK
        uses: actions/download-artifact@v4
        with:
          name: python-sdk.tar.gz
      - name: Build distributions (wheel + sdist)
        run: |
          mkdir -p sdk/python
          tar -xzf python-sdk.tar.gz -C sdk/python
          python -m pip install --upgrade build
          python -m build --outdir dist sdk/python
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish_go_sdk:
    name: publish Go SDK (module tag)
    needs: publish_plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive version from tag
        id: version
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - uses: pulumi/actions@v6
      - uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: pulumi/pulumictl
      - name: Generate Go SDK
        run: make generate_go
      - name: Publish Go SDK
        uses: pulumi/publish-go-sdk-action@v1
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ github.sha }}
          source: sdk
          path: sdk
          version: ${{ env.PROVIDER_VERSION }}
          additive-import-path: github.com/Baubap/pulumi-mlflow/sdk
          files: |
            go/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
