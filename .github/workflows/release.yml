name: release
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-**"

env:
  GOVERSION: "1.26.x"
  NODEVERSION: "20.x"
  PYTHONVERSION: "3.11"
  PROVIDER: mlflow

jobs:
  prerequisites:
    name: build provider + schema
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Derive version from tag
        id: version
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - uses: pulumi/actions@v7
      - uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Build provider + schema
        run: make provider generate_schema
      - name: Package provider binary
        run: tar -zcf pulumi-${{ env.PROVIDER }}-provider.tar.gz -C bin pulumi-resource-${{ env.PROVIDER }}
      - uses: actions/upload-artifact@v6
        with:
          name: pulumi-${{ env.PROVIDER }}-provider.tar.gz
          path: pulumi-${{ env.PROVIDER }}-provider.tar.gz

  build_sdks:
    name: build ${{ matrix.language }} SDK
    needs: prerequisites
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, go]
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Derive version from tag
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - uses: pulumi/actions@v7
      - uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Generate ${{ matrix.language }} SDK
        run: make generate_${{ matrix.language }}
      - name: Build Node.js SDK
        # npm publishes the compiled SDK from sdk/nodejs/bin, so nodejs must be
        # built (tsc), not just generated. Python builds its wheel in
        # publish_python; Go needs only the source.
        if: matrix.language == 'nodejs'
        run: |
          npm install -g yarn
          make build_nodejs
      - name: Package SDK
        # The file inside the artifact must be <lang>.tar.gz — publish_npm and
        # publish_python extract <lang>.tar.gz after download.
        run: tar -zcf ${{ matrix.language }}.tar.gz -C sdk/${{ matrix.language }} .
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ matrix.language }}.tar.gz

  publish_plugin:
    name: publish plugin binaries (GitHub Release)
    needs: build_sdks
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_npm:
    name: publish npm SDK (trusted publishing)
    needs: publish_plugin
    # GitHub-hosted on purpose: npm accepts provenance only from GitHub-hosted
    # runners, and Blacksmith counts as self-hosted (E422 on publish).
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC token for npm trusted publishing — no NPM_TOKEN needed
      contents: read
    steps:
      # Trusted publishing needs npm >= 11.5.1; Node 24 ships npm 11.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
      - name: Download the built Node.js SDK
        uses: actions/download-artifact@v6
        with:
          name: nodejs-sdk.tar.gz
      - name: Check the package version matches the tag
        run: |
          mkdir -p sdk/nodejs
          tar -xzf nodejs.tar.gz -C sdk/nodejs
          npm --version
          want="${GITHUB_REF_NAME#v}"
          got="$(jq -r .version sdk/nodejs/bin/package.json)"
          if [ "$got" != "$want" ]; then
            echo "::error::package.json version $got does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
      # npm exchanges the job's OIDC token for a one-time publish token and adds
      # provenance. The trusted publisher on npmjs.com must name this repo and
      # release.yml. Add dotnet / java jobs once their registry namespaces exist.
      - name: Publish to npm via OIDC
        working-directory: sdk/nodejs/bin
        run: npm publish --access public

  publish_python:
    name: publish PyPI SDK (trusted publishing)
    needs: publish_plugin
    # x86 on purpose: pypa/gh-action-pypi-publish runs a linux/amd64-only Docker
    # image, which fails with "exec format error" on an arm64 runner.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing — no API token needed
      contents: read
    environment: pypi # must match the environment on PyPI's trusted publisher
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download the generated Python SDK
        uses: actions/download-artifact@v6
        with:
          name: python-sdk.tar.gz
      - name: Build distributions (wheel + sdist)
        run: |
          mkdir -p sdk/python
          tar -xzf python.tar.gz -C sdk/python
          python -m pip install --upgrade build
          python -m build --outdir dist sdk/python
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish_go_sdk:
    name: publish Go SDK (module tag)
    needs: publish_plugin
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - name: Derive version from tag
        id: version
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true
      - uses: pulumi/actions@v7
      - uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Tag the Go SDK submodule
        # The Go SDK is committed at sdk/go/mlflow (module
        # github.com/Baubap/pulumi-mlflow/sdk/go/mlflow). Go resolves a module in a
        # subdirectory via a `<subdir>/vX.Y.Z` tag, so publish it by tagging the
        # release commit as sdk/go/mlflow/vX.Y.Z.
        run: |
          TAG="sdk/go/mlflow/v${PROVIDER_VERSION}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
