<!-- Neutral placeholder logo for the Pulumi Registry listing.
     It deliberately does NOT use the MLflow wordmark/logo: this package is
     Apache-2.0 and Baubap-published, and Apache-2.0 grants no trademark rights,
     so shipping MLflow's mark under publisher "Baubap" is not appropriate.
     Replace with a final, Baubap-owned brand asset before/at Registry submission. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Pulumi MLflow provider">
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#5A67D8"/>
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="44" x2="80" y2="64"/>
    <line x1="40" y1="84" x2="80" y2="64"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="40" cy="44" r="11"/>
    <circle cx="40" cy="84" r="11"/>
    <circle cx="88" cy="64" r="13"/>
  </g>
</svg>
